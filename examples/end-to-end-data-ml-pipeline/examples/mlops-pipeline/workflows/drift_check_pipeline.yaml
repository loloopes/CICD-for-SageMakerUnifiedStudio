# =============================================================================
# Bank Mktg Drift Check Pipeline
# =============================================================================
# Compares live raw SOURCE (CSV today; S3 table later) against the snapshot
# taken when training last read that source (features/drift_reference/).
# Writes result.json for the GitHub Actions train gate.
# Does not train or deploy — always succeeds; the gate reads drift_detected.
# =============================================================================

drift_check_pipeline:
  dag_id: drift_check_pipeline
  schedule_interval: null
  catchup: false
  default_args:
    retries: 0

  tasks:
    data_drift_check:
      operator: airflow.providers.amazon.aws.operators.glue.GlueJobOperator
      retries: 0
      # Per-project name so MaxConcurrentRuns is isolated across SMUS projects
      # sharing an account/region. Do not append a run timestamp — that would
      # create a new Glue job definition on every DAG run.
      job_name: "stack-data-drift-{proj.name}"
      script_location: "{proj.connection.default.s3_shared.s3Uri}stack/mlops_pipeline/src/glue_data_drift_check.py"
      s3_bucket: "{proj.connection.default.s3_shared.bucket_name}"
      iam_role_name: "{proj.iam_role_name}"
      region_name: "{domain.region}"
      update_config: true
      script_args:
        # Same path as data_pipeline ingest --source_path (swap for S3 table later).
        "--CURRENT_PATH": "{proj.connection.default.s3_shared.s3Uri}stack/data_pipeline/data/stack-sample.csv"
        "--REFERENCE_PATH": "{proj.connection.default.s3_shared.s3Uri}stack/mlops_pipeline/data/bank_mktg/features/drift_reference/"
        "--REPORT_PATH": "{proj.connection.default.s3_shared.s3Uri}stack/mlops_pipeline/data/bank_mktg/drift_reports/{{ ts_nodash }}/"
        "--PSI_THRESHOLD": "0.2"
      create_job_kwargs:
        GlueVersion: "4.0"
        NumberOfWorkers: 2
        WorkerType: "G.1X"
        Timeout: 600
        MaxRetries: 0

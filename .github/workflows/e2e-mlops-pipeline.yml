name: E2E Deploy MLOps Pipeline

on:
  push:
    branches:
      - main
      - test
    paths:
      - 'examples/end-to-end-data-ml-pipeline/examples/mlops-pipeline/**'
      - 'src/**'
      - '.github/workflows/smus-direct-deploy.yml'
      - '.github/workflows/e2e-mlops-pipeline.yml'
  workflow_dispatch:
    inputs:
      stages:
        description: "Stage(s) to deploy ('all' = dev -> test -> prod)"
        required: true
        default: "all"
        type: choice
        options: [all, dev, test, prod]
      setup_infra:
        description: "Provision MLOps infra (EventBridge + Lambda deploy trigger) — runs once in dev"
        required: false
        default: true
        type: boolean
      check_drift:
        description: "After deploy, run drift_check_pipeline; train only if drift is detected"
        required: false
        default: true
        type: boolean
      run_training:
        description: "Force training_pipeline in dev after deploy (skips the drift gate)"
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

# Single source of truth for per-stage config. Change a value here and every
# job picks it up via needs.resolve-config.outputs.*.
env:
  DEV_ENVIRONMENT: dev-aws-account
  TEST_ENVIRONMENT: dev-aws-account
  PROD_ENVIRONMENT: dev-aws-account
  # SMUS_ prefix keeps these from being read as the CLI's manifest *_PROJECT_NAME vars.
  SMUS_DEV_PROJECT_NAME: ${{ vars.DEV_PROJECT_NAME || 'e2e-data-stack-ml-ops-dev' }}
  SMUS_TEST_PROJECT_NAME: ${{ vars.TEST_PROJECT_NAME || 'e2e-data-stack-ml-ops-test' }}
  SMUS_PROD_PROJECT_NAME: ${{ vars.PROD_PROJECT_NAME || 'e2e-data-stack-ml-ops-prod' }}
  # OIDC role secret name per stage (single account today -> all AWS_ROLE_ARN_DEV).
  # Point a stage at its own account by changing just its secret name here.
  DEV_ROLE_SECRET: AWS_ROLE_ARN_DEV
  TEST_ROLE_SECRET: AWS_ROLE_ARN_DEV
  PROD_ROLE_SECRET: AWS_ROLE_ARN_DEV

jobs:
  # Exposes the env values as job outputs, since the job-level `environment:` key
  # can't read the workflow `env` context directly.
  # On push, inputs are empty — apply the same defaults as workflow_dispatch:
  # stages=all, setup_infra=true, check_drift=true, run_training=false.
  resolve-config:
    runs-on: ubuntu-latest
    outputs:
      dev_environment: ${{ steps.vars.outputs.dev_environment }}
      test_environment: ${{ steps.vars.outputs.test_environment }}
      prod_environment: ${{ steps.vars.outputs.prod_environment }}
      dev_project_name: ${{ steps.vars.outputs.dev_project_name }}
      test_project_name: ${{ steps.vars.outputs.test_project_name }}
      prod_project_name: ${{ steps.vars.outputs.prod_project_name }}
      dev_role_secret: ${{ steps.vars.outputs.dev_role_secret }}
      test_role_secret: ${{ steps.vars.outputs.test_role_secret }}
      prod_role_secret: ${{ steps.vars.outputs.prod_role_secret }}
      stages: ${{ steps.vars.outputs.stages }}
      setup_infra: ${{ steps.vars.outputs.setup_infra }}
      check_drift: ${{ steps.vars.outputs.check_drift }}
      run_training: ${{ steps.vars.outputs.run_training }}
    steps:
      - id: vars
        env:
          # Surface dispatch inputs so skipped drift/train is debuggable in the summary.
          INPUT_STAGES: ${{ inputs.stages }}
          INPUT_SETUP_INFRA: ${{ inputs.setup_infra }}
          INPUT_CHECK_DRIFT: ${{ inputs.check_drift }}
          INPUT_RUN_TRAINING: ${{ inputs.run_training }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Match workflow_dispatch input defaults when push leaves inputs unset.
          STAGES="${INPUT_STAGES:-all}"
          [ -n "${INPUT_STAGES:-}" ] || STAGES="all"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SETUP_INFRA="${INPUT_SETUP_INFRA:-true}"
            CHECK_DRIFT="${INPUT_CHECK_DRIFT:-true}"
            RUN_TRAINING="${INPUT_RUN_TRAINING:-false}"
          else
            SETUP_INFRA="true"
            CHECK_DRIFT="true"
            RUN_TRAINING="false"
          fi
          # Normalize GitHub boolean/string quirks to lowercase true/false.
          normalize_bool() {
            case "$(echo "$1" | tr '[:upper:]' '[:lower:]')" in
              true|1|yes) echo "true" ;;
              *) echo "false" ;;
            esac
          }
          SETUP_INFRA="$(normalize_bool "$SETUP_INFRA")"
          CHECK_DRIFT="$(normalize_bool "$CHECK_DRIFT")"
          RUN_TRAINING="$(normalize_bool "$RUN_TRAINING")"

          echo "dev_environment=$DEV_ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "test_environment=$TEST_ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "prod_environment=$PROD_ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "dev_project_name=$SMUS_DEV_PROJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "test_project_name=$SMUS_TEST_PROJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "prod_project_name=$SMUS_PROD_PROJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "dev_role_secret=$DEV_ROLE_SECRET" >> "$GITHUB_OUTPUT"
          echo "test_role_secret=$TEST_ROLE_SECRET" >> "$GITHUB_OUTPUT"
          echo "prod_role_secret=$PROD_ROLE_SECRET" >> "$GITHUB_OUTPUT"
          echo "stages=$STAGES" >> "$GITHUB_OUTPUT"
          echo "setup_infra=$SETUP_INFRA" >> "$GITHUB_OUTPUT"
          echo "check_drift=$CHECK_DRIFT" >> "$GITHUB_OUTPUT"
          echo "run_training=$RUN_TRAINING" >> "$GITHUB_OUTPUT"
          {
            echo "### Workflow inputs"
            echo ""
            echo "- **event**: \`$EVENT_NAME\`"
            echo "- **stages**: \`$STAGES\`"
            echo "- **setup_infra**: \`$SETUP_INFRA\`"
            echo "- **check_drift**: \`$CHECK_DRIFT\`"
            echo "- **run_training**: \`$RUN_TRAINING\`"
            echo ""
            if [ "$CHECK_DRIFT" = "true" ]; then
              echo "Drift check **will run** after deploy succeeds."
            else
              echo "Drift check **will be skipped** (\`check_drift\` is not true)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Provision the deploy trigger (EventBridge + Lambda) once, in dev.
  setup-infra:
    name: Setup ML Training Pipeline Infrastructure (dev)
    needs: [resolve-config]
    if: >-
      needs.resolve-config.outputs.setup_infra == 'true'
      && (needs.resolve-config.outputs.stages == 'all'
          || needs.resolve-config.outputs.stages == 'dev')
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-config.outputs.dev_environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ vars.DOMAIN_REGION }}
          role-session-name: smus-mlops-infra-session

      - name: Get AWS Account ID
        id: aws-account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account-id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Provision MLOps infra
        env:
          # Dispatch events back to the repo running this workflow (fork-portable).
          GITHUB_REPO: ${{ github.repository }}
          # Pass expressions via env, never inline ${{ }} in run:, to avoid shell injection.
          ACCOUNT_ID: ${{ steps.aws-account.outputs.account-id }}
          REGION: ${{ vars.DOMAIN_REGION }}
          PROJECT_NAME: ${{ needs.resolve-config.outputs.dev_project_name }}
          # Override resource names via repo/environment variables when multiple
          # projects share an account (defaults match setup-mlops-infra.sh).
          DEPLOY_TRIGGER_FUNCTION_NAME: ${{ vars.DEPLOY_TRIGGER_FUNCTION_NAME || 'stack-airflow-deploy-trigger' }}
          DEPLOY_TRIGGER_RULE_NAME: ${{ vars.DEPLOY_TRIGGER_RULE_NAME || 'stack-model-approved' }}
          DEPLOY_TRIGGER_ROLE_NAME: ${{ vars.DEPLOY_TRIGGER_ROLE_NAME || 'stack-airflow-deploy-trigger-role' }}
          MODEL_PACKAGE_GROUP: ${{ vars.MODEL_PACKAGE_GROUP || 'stack-prediction-models' }}
        run: |
          bash examples/end-to-end-data-ml-pipeline/scripts/setup-mlops-infra.sh \
            "dev" \
            "$ACCOUNT_ID" \
            "$REGION" \
            "$PROJECT_NAME"

  # Deploy the selected stage(s) sequentially via the shared reusable. Each matrix
  # entry carries its own role secret and environment so a stage can later move to
  # a distinct role/account by editing just the env block.
  deploy:
    name: Deploy MLOps Pipeline (${{ matrix.stage }})
    needs: [resolve-config, setup-infra]
    if: ${{ always() && needs.setup-infra.result != 'failure' && needs.setup-infra.result != 'cancelled' }}
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include: >-
          ${{ fromJSON(
          needs.resolve-config.outputs.stages == 'dev' && format('[{{"stage":"dev","role_secret":"{0}","environment":"{1}"}}]', needs.resolve-config.outputs.dev_role_secret, needs.resolve-config.outputs.dev_environment)
          || needs.resolve-config.outputs.stages == 'test' && format('[{{"stage":"test","role_secret":"{0}","environment":"{1}"}}]', needs.resolve-config.outputs.test_role_secret, needs.resolve-config.outputs.test_environment)
          || needs.resolve-config.outputs.stages == 'prod' && format('[{{"stage":"prod","role_secret":"{0}","environment":"{1}"}}]', needs.resolve-config.outputs.prod_role_secret, needs.resolve-config.outputs.prod_environment)
          || format('[{{"stage":"dev","role_secret":"{0}","environment":"{1}"}},{{"stage":"test","role_secret":"{2}","environment":"{3}"}},{{"stage":"prod","role_secret":"{4}","environment":"{5}"}}]', needs.resolve-config.outputs.dev_role_secret, needs.resolve-config.outputs.dev_environment, needs.resolve-config.outputs.test_role_secret, needs.resolve-config.outputs.test_environment, needs.resolve-config.outputs.prod_role_secret, needs.resolve-config.outputs.prod_environment)
          ) }}
    uses: ./.github/workflows/smus-direct-deploy.yml
    secrets:
      AWS_ROLE_ARN: ${{ secrets[matrix.role_secret] }}
      PROJECT_OWNER_ARN: ${{ secrets.PROJECT_OWNER_ARN }}
    with:
      manifest_path: 'examples/end-to-end-data-ml-pipeline/examples/mlops-pipeline/manifest.yaml'
      target: ${{ matrix.stage }}
      environment_name: ${{ matrix.environment }}
      skip_tests: true
      # Ensures the MLflow tracking server exists (creates it only if missing).
      setup_mlflow: true

  # Optional: compare current DataOps data vs last training reference.
  # Missing reference / result => drift_detected=true so the first train can bootstrap.
  # Runs on push and workflow_dispatch when resolved check_drift=true.
  drift-check:
    name: Check data drift (dev)
    needs: [resolve-config, deploy]
    if: >-
      always()
      && needs.resolve-config.outputs.check_drift == 'true'
      && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ needs.resolve-config.outputs.dev_environment }}
    outputs:
      drift_detected: ${{ steps.read.outputs.drift_detected }}
      reason: ${{ steps.read.outputs.reason }}
      result_uri: ${{ steps.read.outputs.result_uri }}
    env:
      STAGE: dev
      MANIFEST_DIR: examples/end-to-end-data-ml-pipeline/examples/mlops-pipeline
      WORKFLOW_NAME: drift_check_pipeline
      DEV_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
      TEST_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
      PROD_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
      DEV_PROJECT_NAME: ${{ vars.DEV_PROJECT_NAME || 'e2e-data-stack-ml-ops-dev' }}
      TEST_PROJECT_NAME: ${{ vars.TEST_PROJECT_NAME || 'e2e-data-stack-ml-ops-test' }}
      PROD_PROJECT_NAME: ${{ vars.PROD_PROJECT_NAME || 'e2e-data-stack-ml-ops-prod' }}
      DOMAIN_TAG_PURPOSE: ${{ vars.DOMAIN_TAG_PURPOSE }}
      PROJECT_OWNER_ARN: ${{ secrets.PROJECT_OWNER_ARN || 'arn:aws:iam:::user/lopes@stacktecnologias.com.br' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Authenticate via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[needs.resolve-config.outputs.dev_role_secret] }}
          aws-region: ${{ vars.DOMAIN_REGION || 'us-east-1' }}
          role-session-name: smus-mlops-drift-session

      - name: Install CLI
        # Install from this checkout so monitor --live failure exit codes apply.
        run: pip install -e . -q

      - name: Run drift_check_pipeline DAG
        working-directory: ${{ env.MANIFEST_DIR }}
        # monitor --live exits 1 if the DAG run transitions to FAILED/STOPPED/CANCELLED.
        run: |
          set -euo pipefail
          aws-smus-cicd-cli run --manifest manifest.yaml --targets "$STAGE" --workflow "$WORKFLOW_NAME"
          aws-smus-cicd-cli monitor --manifest manifest.yaml --targets "$STAGE" --live

      - name: Read drift result
        id: read
        env:
          PROJECT_NAME: ${{ needs.resolve-config.outputs.dev_project_name }}
          REGION: ${{ vars.DOMAIN_REGION || 'us-east-1' }}
          DOMAIN_TAG_PURPOSE: ${{ vars.DOMAIN_TAG_PURPOSE }}
        run: |
          TAGS_ARG=()
          if [ -n "${DOMAIN_TAG_PURPOSE:-}" ]; then
            TAGS_ARG=(--domain-tags "purpose=${DOMAIN_TAG_PURPOSE}")
          fi
          python3 examples/end-to-end-data-ml-pipeline/scripts/mlops_helper.py read-drift-result \
            --project-name "$PROJECT_NAME" \
            --region "$REGION" \
            "${TAGS_ARG[@]}"

      - name: Summary
        env:
          DETECTED: ${{ steps.read.outputs.drift_detected }}
          REASON: ${{ steps.read.outputs.reason }}
          RESULT_URI: ${{ steps.read.outputs.result_uri }}
        run: |
          {
            echo "### Data drift check"
            echo ""
            echo "- **drift_detected**: \`$DETECTED\`"
            echo "- **reason**: \`$REASON\`"
            if [ -n "$RESULT_URI" ]; then
              echo "- **result**: \`$RESULT_URI\`"
            fi
            if [ "$DETECTED" = "true" ]; then
              echo ""
              echo "Training will run next (unless cancelled)."
            else
              echo ""
              echo "No drift — training will be skipped (use \`run_training\` to force)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Kick off training after deploy when drift was detected, or when force-train is set.
  # Standalone retrain without redeploy: use e2e-mlops-train.yml.
  train:
    name: Run training_pipeline (dev)
    needs: [resolve-config, deploy, drift-check]
    # always() so force-train still runs when drift-check was skipped (check_drift=false).
    if: >-
      always()
      && needs.deploy.result == 'success'
      && ((needs.resolve-config.outputs.run_training == 'true')
          || ((needs.resolve-config.outputs.check_drift == 'true')
              && needs.drift-check.result == 'success'
              && needs.drift-check.outputs.drift_detected == 'true'))
    uses: ./.github/workflows/e2e-mlops-train.yml
    secrets: inherit

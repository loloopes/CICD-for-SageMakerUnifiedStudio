# On-demand / scheduled SageMaker Batch Transform for the MLOps e2e example.
# Scores a feature split with the model currently serving stack-prediction-{stage}.
#
# Schedule: set repository variable BATCH_INFERENCE_CRON (POSIX cron).
# GitHub Actions requires a literal cron under on.schedule — keep that string
# identical to BATCH_INFERENCE_CRON (default: Mondays 14:00 UTC).
name: E2E Weekly Batch Inference

on:
  schedule:
    # Literal required (expressions invalid here). Mirror vars.BATCH_INFERENCE_CRON.
    - cron: '0 14 * * 1'
  workflow_dispatch:
    inputs:
      stage:
        description: "Which endpoint's model to score with (stack-prediction-{stage})"
        required: true
        default: dev
        type: choice
        options: [dev, test, prod]
      split:
        description: "Feature dataset to score (train / validation / test CSVs)"
        required: false
        default: train
        type: choice
        options: [train, validation, test]
      max_rows:
        description: "Cap rows sent to Batch Transform (0 = all)"
        required: false
        default: '0'
      project_name:
        description: "Override SMUS project (default: stage project name)"
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

env:
  BATCH_INFERENCE_CRON: ${{ vars.BATCH_INFERENCE_CRON || '0 14 * * 1' }}
  DEV_ENVIRONMENT: dev-aws-account
  TEST_ENVIRONMENT: test-aws-account
  PROD_ENVIRONMENT: prod-aws-account
  DEV_ROLE_SECRET: AWS_ROLE_ARN_DEV
  TEST_ROLE_SECRET: AWS_ROLE_ARN_TEST
  PROD_ROLE_SECRET: AWS_ROLE_ARN_PROD
  DEV_PROJECT_NAME: ${{ vars.DEV_PROJECT_NAME || 'e2e-data-stack-ml-ops-dev' }}
  TEST_PROJECT_NAME: ${{ vars.TEST_PROJECT_NAME || 'e2e-data-stack-ml-ops-test' }}
  PROD_PROJECT_NAME: ${{ vars.PROD_PROJECT_NAME || 'e2e-data-stack-ml-ops-prod' }}

jobs:
  resolve-config:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'schedule' ||
      github.event.schedule == vars.BATCH_INFERENCE_CRON ||
      (vars.BATCH_INFERENCE_CRON == '' && github.event.schedule == '0 14 * * 1')
    outputs:
      stage: ${{ steps.vars.outputs.stage }}
      endpoint_name: ${{ steps.vars.outputs.endpoint_name }}
      environment: ${{ steps.vars.outputs.environment }}
      role_secret: ${{ steps.vars.outputs.role_secret }}
      project_name: ${{ steps.vars.outputs.project_name }}
      split: ${{ steps.vars.outputs.split }}
      max_rows: ${{ steps.vars.outputs.max_rows }}
    steps:
      - id: vars
        env:
          STAGE_IN: ${{ inputs.stage || 'dev' }}
          SPLIT_IN: ${{ inputs.split || 'train' }}
          MAX_ROWS_IN: ${{ inputs.max_rows || '0' }}
          PROJECT_OVERRIDE: ${{ inputs.project_name || '' }}
        run: |
          set -euo pipefail
          STAGE="$STAGE_IN"
          case "$STAGE" in
            dev)
              ENV_NAME="$DEV_ENVIRONMENT"
              ROLE_SECRET="$DEV_ROLE_SECRET"
              PROJECT="$DEV_PROJECT_NAME"
              ;;
            test)
              ENV_NAME="$TEST_ENVIRONMENT"
              ROLE_SECRET="$TEST_ROLE_SECRET"
              PROJECT="$TEST_PROJECT_NAME"
              ;;
            prod)
              ENV_NAME="$PROD_ENVIRONMENT"
              ROLE_SECRET="$PROD_ROLE_SECRET"
              PROJECT="$PROD_PROJECT_NAME"
              ;;
            *)
              echo "Unknown stage: $STAGE" >&2
              exit 1
              ;;
          esac
          if [ -n "${PROJECT_OVERRIDE}" ]; then
            PROJECT="$PROJECT_OVERRIDE"
          fi
          {
            echo "stage=$STAGE"
            echo "endpoint_name=stack-prediction-${STAGE}"
            echo "environment=$ENV_NAME"
            echo "role_secret=$ROLE_SECRET"
            echo "project_name=$PROJECT"
            echo "split=$SPLIT_IN"
            echo "max_rows=$MAX_ROWS_IN"
          } >> "$GITHUB_OUTPUT"

  batch-inference:
    name: Batch Transform (${{ needs.resolve-config.outputs.stage }})
    needs: [resolve-config]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-config.outputs.environment }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Authenticate via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[needs.resolve-config.outputs.role_secret] }}
          aws-region: ${{ vars.DOMAIN_REGION || 'us-east-2' }}
          role-session-name: smus-batch-inference-oidc

      - name: Install CLI + deps
        run: pip install -e . boto3 -q

      - name: Resolve stage project + DEV features shared
        id: ctx
        env:
          PROJECT_NAME: ${{ needs.resolve-config.outputs.project_name }}
          DEV_PROJECT: ${{ env.DEV_PROJECT_NAME }}
          REGION: ${{ vars.DOMAIN_REGION || 'us-east-2' }}
          DOMAIN_TAG_PURPOSE: ${{ vars.DOMAIN_TAG_PURPOSE }}
          SHARED_S3_URI_OVERRIDE: ${{ vars.BATCH_SHARED_S3_URI }}
          PROJECT_ROLE_ARN_OVERRIDE: ${{ vars.PROJECT_EXECUTION_ROLE_ARN }}
          FEATURES_SHARED_OVERRIDE: ${{ vars.BATCH_FEATURES_SHARED_S3_URI }}
        run: |
          set -euo pipefail
          TAGS_ARG=()
          if [ -n "${DOMAIN_TAG_PURPOSE:-}" ]; then
            TAGS_ARG=(--domain-tags "purpose=${DOMAIN_TAG_PURPOSE}")
          fi

          resolve_ctx() {
            local project="$1"
            local out_file="$2"
            # Isolate GITHUB_OUTPUT so dual lookups do not clobber each other.
            local saved="$GITHUB_OUTPUT"
            export GITHUB_OUTPUT="$out_file"
            : > "$out_file"
            python3 examples/end-to-end-data-ml-pipeline/scripts/mlops_helper.py \
              resolve-batch-context \
              --project-name "$project" \
              --region "$REGION" \
              "${TAGS_ARG[@]}"
            export GITHUB_OUTPUT="$saved"
          }

          STAGE_OUT="$(mktemp)"
          if [ -n "${SHARED_S3_URI_OVERRIDE:-}" ] && [ -n "${PROJECT_ROLE_ARN_OVERRIDE:-}" ]; then
            echo "shared_s3_uri=${SHARED_S3_URI_OVERRIDE}" > "$STAGE_OUT"
            echo "project_role_arn=${PROJECT_ROLE_ARN_OVERRIDE}" >> "$STAGE_OUT"
          else
            resolve_ctx "$PROJECT_NAME" "$STAGE_OUT"
          fi
          SHARED_S3_URI="$(awk -F= '/^shared_s3_uri=/{print substr($0,index($0,"=")+1)}' "$STAGE_OUT")"
          PROJECT_ROLE_ARN="$(awk -F= '/^project_role_arn=/{print substr($0,index($0,"=")+1)}' "$STAGE_OUT")"

          DEV_ROLE_ARN=""
          if [ -n "${FEATURES_SHARED_OVERRIDE:-}" ]; then
            FEATURES_SHARED_S3_URI="$FEATURES_SHARED_OVERRIDE"
          elif [ "$PROJECT_NAME" = "$DEV_PROJECT" ]; then
            FEATURES_SHARED_S3_URI="$SHARED_S3_URI"
            DEV_ROLE_ARN="$PROJECT_ROLE_ARN"
          else
            DEV_OUT="$(mktemp)"
            resolve_ctx "$DEV_PROJECT" "$DEV_OUT"
            FEATURES_SHARED_S3_URI="$(awk -F= '/^shared_s3_uri=/{print substr($0,index($0,"=")+1)}' "$DEV_OUT")"
            DEV_ROLE_ARN="$(awk -F= '/^project_role_arn=/{print substr($0,index($0,"=")+1)}' "$DEV_OUT")"
          fi

          {
            echo "shared_s3_uri=${SHARED_S3_URI}"
            echo "project_role_arn=${PROJECT_ROLE_ARN}"
            echo "features_shared_s3_uri=${FEATURES_SHARED_S3_URI}"
            echo "dev_project_role_arn=${DEV_ROLE_ARN}"
          } >> "$GITHUB_OUTPUT"

          echo "Stage shared : $SHARED_S3_URI"
          echo "Features from: $FEATURES_SHARED_S3_URI"
          echo "Project role : $PROJECT_ROLE_ARN"
          echo "DEV role     : $DEV_ROLE_ARN"

      # Stage roles cannot read DEV project prefixes. Prefetch CSVs onto the
      # runner with a short-lived DEV assume-role (does not replace job creds).
      - name: Prefetch DEV features onto runner
        if: needs.resolve-config.outputs.stage != 'dev'
        env:
          DEV_ROLE_ARN: ${{ steps.ctx.outputs.dev_project_role_arn }}
          FEATURES_SHARED_S3_URI: ${{ steps.ctx.outputs.features_shared_s3_uri }}
          SPLIT: ${{ needs.resolve-config.outputs.split }}
          REGION: ${{ vars.DOMAIN_REGION || 'us-east-2' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/batch-features
          CREDS=$(aws sts assume-role \
            --role-arn "$DEV_ROLE_ARN" \
            --role-session-name smus-batch-prefetch \
            --query 'Credentials' --output json)
          export AWS_ACCESS_KEY_ID
          export AWS_SECRET_ACCESS_KEY
          export AWS_SESSION_TOKEN
          AWS_ACCESS_KEY_ID=$(jq -r .AccessKeyId <<<"$CREDS")
          AWS_SECRET_ACCESS_KEY=$(jq -r .SecretAccessKey <<<"$CREDS")
          AWS_SESSION_TOKEN=$(jq -r .SessionToken <<<"$CREDS")
          SRC="${FEATURES_SHARED_S3_URI%/}/stack/mlops_pipeline/data/bank_mktg/features/${SPLIT}/"
          echo "Syncing $SRC -> /tmp/batch-features/"
          aws s3 sync "$SRC" /tmp/batch-features/ --region "$REGION"
          ls -la /tmp/batch-features/
          test -n "$(find /tmp/batch-features -name '*.csv' | head -1)"

      - name: Assume project execution role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.ctx.outputs.project_role_arn }}
          aws-region: ${{ vars.DOMAIN_REGION || 'us-east-2' }}
          role-session-name: smus-batch-inference
          role-chaining: true
          # OIDC→datazone hop: GitHubActionsRole has sts:AssumeRole but not
          # sts:TagSession on datazone_usr_role_*. Skip tags so chaining works.
          role-skip-session-tagging: true

      - name: Run batch inference
        env:
          REGION: ${{ vars.DOMAIN_REGION || 'us-east-2' }}
          SHARED_S3_URI: ${{ steps.ctx.outputs.shared_s3_uri }}
          FEATURES_SHARED_S3_URI: ${{ steps.ctx.outputs.features_shared_s3_uri }}
          PROJECT_ROLE_ARN: ${{ steps.ctx.outputs.project_role_arn }}
          ENDPOINT_NAME: ${{ needs.resolve-config.outputs.endpoint_name }}
          STAGE: ${{ needs.resolve-config.outputs.stage }}
          SPLIT: ${{ needs.resolve-config.outputs.split }}
          MAX_ROWS: ${{ needs.resolve-config.outputs.max_rows }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "$STAGE" != "dev" ]; then
            EXTRA+=(--features-local-dir /tmp/batch-features)
          else
            EXTRA+=(--features-shared-s3-uri "$FEATURES_SHARED_S3_URI")
          fi
          python3 examples/end-to-end-data-ml-pipeline/scripts/batch_inference_smoke.py \
            --shared-s3-uri "$SHARED_S3_URI" \
            --region "$REGION" \
            --role-arn "$PROJECT_ROLE_ARN" \
            --endpoint-name "$ENDPOINT_NAME" \
            --stage "$STAGE" \
            --split "$SPLIT" \
            --max-rows "$MAX_ROWS" \
            "${EXTRA[@]}"

      - name: Summary
        if: always()
        env:
          SHARED_S3_URI: ${{ steps.ctx.outputs.shared_s3_uri }}
          FEATURES_SHARED_S3_URI: ${{ steps.ctx.outputs.features_shared_s3_uri }}
          PROJECT_ROLE_ARN: ${{ steps.ctx.outputs.project_role_arn }}
          ENDPOINT_NAME: ${{ needs.resolve-config.outputs.endpoint_name }}
          STAGE: ${{ needs.resolve-config.outputs.stage }}
          SPLIT: ${{ needs.resolve-config.outputs.split }}
          CRON: ${{ env.BATCH_INFERENCE_CRON }}
        run: |
          {
            echo "### Batch inference"
            echo ""
            echo "- **stage / endpoint**: \`$STAGE\` / \`$ENDPOINT_NAME\`"
            echo "- **cron**: \`$CRON\` (vars.BATCH_INFERENCE_CRON)"
            echo "- **split**: \`$SPLIT\`"
            echo "- **features from**: \`$FEATURES_SHARED_S3_URI\`"
            echo "- **output shared**: \`$SHARED_S3_URI\`"
            echo "- **role**: \`$PROJECT_ROLE_ARN\`"
            echo "- **output**: \`…/stack/mlops_pipeline/models/evaluation/batch_smoke/\`"
          } >> "$GITHUB_STEP_SUMMARY"

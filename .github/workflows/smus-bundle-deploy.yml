name: SMUS Bundle and Deploy (Reusable)

on:
  workflow_call:
    inputs:
      manifest_path:
        description: 'Path to manifest file'
        required: false
        type: string
        default: 'manifest.yaml'
      
      test_target:
        description: 'Test environment target name'
        required: false
        type: string
        default: 'test'
      
      prod_target:
        description: 'Production environment target name'
        required: false
        type: string
        default: 'prod'
      
      python_version:
        description: 'Python version'
        required: false
        type: string
        default: '3.12'
      
      aws_region:
        description: 'AWS region'
        required: false
        type: string
        default: 'us-east-1'
      
      skip_tests:
        description: 'Skip test execution'
        required: false
        type: boolean
        default: false
      
      deploy_to_prod:
        description: 'Deploy to production after test'
        required: false
        type: boolean
        default: true
      
      bundle_from_target:
        description: 'Target to bundle from (default: dev)'
        required: false
        type: string
        default: 'dev'
      
      quicksight_setup_script:
        description: 'Optional path to QuickSight setup script to run before bundling'
        required: false
        type: string
        default: ''
      
      setup_mlflow:
        description: 'Setup MLflow tracking server infrastructure'
        required: false
        type: boolean
        default: false

      destroy_test_after_deploy:
        description: 'Run destroy on test environment after tests pass and verify cleanup'
        required: false
        type: boolean
        default: false
    
    secrets:
      AWS_ROLE_ARN_DEV:
        description: 'AWS IAM Role ARN for dev account'
        required: true
      AWS_ROLE_ARN_TEST:
        description: 'AWS IAM Role ARN for test account'
        required: true
      AWS_ROLE_ARN_PROD:
        description: 'AWS IAM Role ARN for prod account'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  bundle:
    name: Bundle Application
    runs-on: ubuntu-latest
    environment: ${{ fromJSON('{"dev":"dev-aws-account","test":"test-aws-account","prod":"prod-aws-account","dev-idc":"dev-aws-account","test-idc":"test-aws-account","prod-idc":"prod-aws-account"}')[inputs.bundle_from_target] || 'dev-aws-account' }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
      
      - name: Install SMUS CI/CD CLI
        run: |
          
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Determine AWS Role ARN for bundle source
        id: bundle-role
        run: |
          case "${{ inputs.bundle_from_target }}" in
            dev|dev-idc)
              echo "role-arn=${{ secrets.AWS_ROLE_ARN_DEV }}" >> $GITHUB_OUTPUT
              ;;
            test|test-idc)
              echo "role-arn=${{ secrets.AWS_ROLE_ARN_TEST }}" >> $GITHUB_OUTPUT
              ;;
            prod|prod-idc)
              echo "role-arn=${{ secrets.AWS_ROLE_ARN_PROD }}" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "❌ Invalid bundle_from_target: ${{ inputs.bundle_from_target }}"
              echo "   Valid values: dev, test, prod, dev-idc, test-idc, prod-idc"
              exit 1
              ;;
          esac
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.bundle-role.outputs.role-arn }}
          aws-region: ${{ vars.DOMAIN_REGION }}
          role-session-name: smus-bundle-session
      
      - name: Setup QuickSight dashboard (optional)
        if: ${{ inputs.quicksight_setup_script != '' }}
        env:
          DEV_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
        run: |
          echo "📊 Setting up QuickSight dashboard..."
          python ${{ inputs.quicksight_setup_script }}
      
      - name: aws-smus-cicd-cli describe (validate bundle source target)
        env:
          DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          DEV_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          TEST_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          PROD_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
        run: |
          echo "🔍 Validating bundle source target: ${{ inputs.bundle_from_target }}"
          
          aws-smus-cicd-cli describe --manifest ${{ inputs.manifest_path }} --targets ${{ inputs.bundle_from_target }} --connect
      
      - name: aws-smus-cicd-cli bundle from ${{ inputs.bundle_from_target }}
        env:
          DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          DEV_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          TEST_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          PROD_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
        run: |
          echo "🔍 DOMAIN_REGION: $DOMAIN_REGION"
          echo "🔍 DEV_DOMAIN_REGION: $DEV_DOMAIN_REGION"
          echo "🔍 TEST_DOMAIN_REGION: $TEST_DOMAIN_REGION"
          echo "🔍 PROD_DOMAIN_REGION: $PROD_DOMAIN_REGION"
          echo "📦 Bundling from target: ${{ inputs.bundle_from_target }}"
          BUNDLE_DIR="${{ runner.temp }}/smus-bundles-${{ github.run_id }}"
          mkdir -p "$BUNDLE_DIR"
          echo "BUNDLE_DIR=$BUNDLE_DIR" >> $GITHUB_ENV
          
          aws-smus-cicd-cli bundle \
            --manifest ${{ inputs.manifest_path }} \
            --targets ${{ inputs.bundle_from_target }} \
            --output-dir "$BUNDLE_DIR"
      
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-bundle-${{ inputs.bundle_from_target }}
          path: ${{ env.BUNDLE_DIR }}/*.zip
          if-no-files-found: error

  validate:
    name: Validate Manifest
    runs-on: ubuntu-latest
    needs: bundle
    if: ${{ needs.bundle.result == 'success' }}
    environment: test-aws-account
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
      
      - name: Install SMUS CI/CD CLI
        run: |
          
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TEST }}
          aws-region: ${{ vars.DOMAIN_REGION }}
          role-session-name: smus-validate-session
      
      - name: aws-smus-cicd-cli describe (validate test target)
        env:
          DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          DEV_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          TEST_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          PROD_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
        run: |
          echo "🔍 DOMAIN_REGION: $DOMAIN_REGION"
          echo "🔍 TEST_DOMAIN_REGION: $TEST_DOMAIN_REGION"
          echo "🔍 AWS_REGION: $AWS_REGION"
          
          aws-smus-cicd-cli describe --manifest ${{ inputs.manifest_path }} --targets ${{ inputs.test_target }} --connect

  deploy-test:
    name: Deploy to Test
    runs-on: ubuntu-latest
    needs: [bundle, validate]
    if: ${{ needs.bundle.result == 'success' && needs.validate.result == 'success' }}
    environment: test-aws-account
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-bundle-${{ inputs.bundle_from_target }}
          path: ${{ runner.temp }}/smus-bundles-${{ github.run_id }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
      
      - name: Install SMUS CI/CD CLI
        run: |
          
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TEST }}
          aws-region: ${{ vars.DOMAIN_REGION }}
          role-session-name: smus-deploy-test-session
      
      - name: Get AWS Account ID
        id: aws-account-test
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account-id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "✓ AWS Account ID: $ACCOUNT_ID"
      
      - name: Setup MLflow Tracking Server
        id: mlflow-setup-test
        if: ${{ inputs.setup_mlflow }}
        run: |
          REGION="${{ vars.DOMAIN_REGION }}"
          ACCOUNT_ID="${{ steps.aws-account-test.outputs.account-id }}"
          STACK_NAME="smus-shared-resources"
          TRACKING_SERVER_NAME="smus-integration-mlflow-${REGION}"
          
          echo "🔍 Checking for existing MLflow tracking server..."
          
          # Check if tracking server exists
          SERVER_EXISTS=$(aws sagemaker list-mlflow-tracking-servers \
            --region "$REGION" \
            --query "TrackingServerSummaries[?TrackingServerName=='$TRACKING_SERVER_NAME'].TrackingServerName" \
            --output text)
          
          if [ -n "$SERVER_EXISTS" ]; then
            echo "✅ MLflow tracking server '$TRACKING_SERVER_NAME' already exists"
            echo "tracking-server-name=$TRACKING_SERVER_NAME" >> $GITHUB_OUTPUT
          else
            echo "📦 MLflow tracking server not found, deploying CloudFormation stack..."
            
            # Deploy CloudFormation stack
            aws cloudformation deploy \
              --template-file tests/scripts/setup/idc-based-domains/5-testing-infrastructure/testing-infrastructure/shared-resources-template.yaml \
              --stack-name "$STACK_NAME" \
              --parameter-overrides \
                S3BucketName="smus-mlflow-artifacts-${ACCOUNT_ID}-${REGION}" \
                TrackingServerName="$TRACKING_SERVER_NAME" \
                TrackingServerSize="Small" \
              --capabilities CAPABILITY_NAMED_IAM \
              --region "$REGION"
            
            # Get the tracking server ARN from stack outputs
            MLFLOW_ARN=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$REGION" \
              --query 'Stacks[0].Outputs[?OutputKey==`MLflowTrackingServerArn`].OutputValue' \
              --output text)
            
            echo "✅ MLflow infrastructure deployed successfully"
            echo "   Tracking Server: $TRACKING_SERVER_NAME"
            echo "   ARN: $MLFLOW_ARN"
            echo "tracking-server-name=$TRACKING_SERVER_NAME" >> $GITHUB_OUTPUT
          fi
      
      - name: aws-smus-cicd-cli describe (validate test target)
        env:
          DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          DEV_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          TEST_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          PROD_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
        run: |
          echo "🔍 Validating test target: ${{ inputs.test_target }}"
          
          aws-smus-cicd-cli describe --manifest ${{ inputs.manifest_path }} --targets ${{ inputs.test_target }} --connect
      
      - name: aws-smus-cicd-cli deploy --dry-run (pre-deploy validation)
        env:
          DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          DEV_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          TEST_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          PROD_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          STS_REGION: ${{ vars.DOMAIN_REGION }}
          STS_ACCOUNT_ID: ${{ steps.aws-account-test.outputs.account-id }}
          AWS_ACCOUNT_ID: ${{ steps.aws-account-test.outputs.account-id }}
          MODEL_NAME: ${{ vars.MODEL_NAME || 'latest' }}
        run: |
          echo "🔍 MODEL_NAME: $MODEL_NAME"
          echo "🔍 Running dry-run validation before deploying to test..."
          BUNDLE_FILE=$(ls ${{ runner.temp }}/smus-bundles-${{ github.run_id }}/*.zip | head -1)
          
          aws-smus-cicd-cli deploy \
            --manifest ${{ inputs.manifest_path }} \
            --targets ${{ inputs.test_target }} \
            --bundle-archive-path "$BUNDLE_FILE" \
            --dry-run

      - name: aws-smus-cicd-cli deploy to test
        env:
          DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          DEV_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          TEST_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          PROD_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          MLFLOW_TRACKING_SERVER_NAME: ${{ inputs.setup_mlflow && format('smus-integration-mlflow-{0}', vars.DOMAIN_REGION) || '' }}
          STS_REGION: ${{ vars.DOMAIN_REGION }}
          STS_ACCOUNT_ID: ${{ steps.aws-account-test.outputs.account-id }}
          AWS_ACCOUNT_ID: ${{ steps.aws-account-test.outputs.account-id }}
          MODEL_NAME: ${{ vars.MODEL_NAME || 'latest' }}
        run: |
          echo "🔍 DOMAIN_REGION: $DOMAIN_REGION"
          echo "🔍 TEST_DOMAIN_REGION: $TEST_DOMAIN_REGION"
          echo "🔍 MODEL_NAME: $MODEL_NAME"
          BUNDLE_FILE=$(ls ${{ runner.temp }}/smus-bundles-${{ github.run_id }}/*.zip | head -1)
          echo "🔍 Using bundle: $BUNDLE_FILE"
          
          aws-smus-cicd-cli deploy \
            --manifest ${{ inputs.manifest_path }} \
            --targets ${{ inputs.test_target }} \
            --bundle-archive-path "$BUNDLE_FILE"
      
      - name: Download workflow output notebooks
        if: always()
        continue-on-error: true
        run: |
          
          
          # Extract workflow name from manifest
          echo "📥 Downloading workflow output notebooks..."
          python3 << 'EOF'
          import yaml
          import subprocess
          import sys
          
          manifest_path = "${{ inputs.manifest_path }}"
          test_target = "${{ inputs.test_target }}"
          region = "${{ vars.DOMAIN_REGION }}"
          
          try:
              with open(manifest_path, 'r') as f:
                  manifest = yaml.safe_load(f)
              
              app_name = manifest.get('applicationName', '')
              stages = manifest.get('stages', {})
              target_config = stages.get(test_target, {})
              project_name = target_config.get('project', {}).get('name', '')
              workflows = manifest.get('content', {}).get('workflows', [])
              
              if not workflows or not project_name:
                  print("No workflows or project name found in manifest")
                  sys.exit(0)
              
              for workflow in workflows:
                  workflow_name = workflow.get('workflowName', '')
                  if workflow_name:
                      full_name = f"{app_name}_{project_name}_{workflow_name}"
                      print(f"📥 Downloading outputs for: {full_name}")
                      result = subprocess.run([
                          'python3', 'tests/scripts/download_workflow_outputs_from_xcom.py',
                          full_name,
                          '--region', region,
                          '--output-dir', 'tests/test-outputs/notebooks'
                      ], capture_output=True, text=True)
                      if result.stdout:
                          print(result.stdout)
                      if result.returncode == 0:
                          print(f"✅ Downloaded outputs for {workflow_name}")
                      else:
                          print(f"⚠️ No outputs found for {workflow_name}")
          except Exception as e:
              print(f"⚠️ Error downloading notebooks: {e}")
          EOF

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [bundle, validate, deploy-test]
    # Run if tests are not skipped AND all upstream jobs succeeded
    if: ${{ !inputs.skip_tests && needs.bundle.result == 'success' && needs.validate.result == 'success' && needs.deploy-test.result == 'success' }}
    environment: test-aws-account
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
      
      - name: Install SMUS CI/CD CLI
        run: |
          
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TEST }}
          aws-region: ${{ vars.DOMAIN_REGION }}
          role-session-name: smus-test-session
      
      - name: aws-smus-cicd-cli test
        env:
          DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          DEV_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          TEST_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          PROD_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
        run: |
          echo "🔍 DOMAIN_REGION: $DOMAIN_REGION"
          echo "🔍 TEST_DOMAIN_REGION: $TEST_DOMAIN_REGION"
          
          aws-smus-cicd-cli test \
            --manifest ${{ inputs.manifest_path }} \
            --targets ${{ inputs.test_target }}

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [bundle, validate, deploy-test, test]
    # Deploy to prod if enabled AND all upstream jobs succeeded (or tests were skipped when skip_tests is true)
    if: ${{ inputs.deploy_to_prod && needs.bundle.result == 'success' && needs.validate.result == 'success' && needs.deploy-test.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    environment: prod-aws-account
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-bundle-${{ inputs.bundle_from_target }}
          path: ${{ runner.temp }}/smus-bundles-${{ github.run_id }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
      
      - name: Install SMUS CI/CD CLI
        run: |
          
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ vars.DOMAIN_REGION }}
          role-session-name: smus-deploy-prod-session
      
      - name: Get AWS Account ID
        id: aws-account-prod
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account-id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "✓ AWS Account ID: $ACCOUNT_ID"
      
      - name: Setup MLflow Tracking Server
        id: mlflow-setup-prod
        if: ${{ inputs.setup_mlflow }}
        run: |
          REGION="${{ vars.DOMAIN_REGION }}"
          ACCOUNT_ID="${{ steps.aws-account-prod.outputs.account-id }}"
          STACK_NAME="smus-shared-resources"
          TRACKING_SERVER_NAME="smus-integration-mlflow-${REGION}"
          
          echo "🔍 Checking for existing MLflow tracking server..."
          
          # Check if tracking server exists
          SERVER_EXISTS=$(aws sagemaker list-mlflow-tracking-servers \
            --region "$REGION" \
            --query "TrackingServerSummaries[?TrackingServerName=='$TRACKING_SERVER_NAME'].TrackingServerName" \
            --output text)
          
          if [ -n "$SERVER_EXISTS" ]; then
            echo "✅ MLflow tracking server '$TRACKING_SERVER_NAME' already exists"
            echo "tracking-server-name=$TRACKING_SERVER_NAME" >> $GITHUB_OUTPUT
          else
            echo "📦 MLflow tracking server not found, deploying CloudFormation stack..."
            
            # Deploy CloudFormation stack
            aws cloudformation deploy \
              --template-file tests/scripts/setup/idc-based-domains/5-testing-infrastructure/testing-infrastructure/shared-resources-template.yaml \
              --stack-name "$STACK_NAME" \
              --parameter-overrides \
                S3BucketName="smus-mlflow-artifacts-${ACCOUNT_ID}-${REGION}" \
                TrackingServerName="$TRACKING_SERVER_NAME" \
                TrackingServerSize="Small" \
              --capabilities CAPABILITY_NAMED_IAM \
              --region "$REGION"
            
            # Get the tracking server ARN from stack outputs
            MLFLOW_ARN=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$REGION" \
              --query 'Stacks[0].Outputs[?OutputKey==`MLflowTrackingServerArn`].OutputValue' \
              --output text)
            
            echo "✅ MLflow infrastructure deployed successfully"
            echo "   Tracking Server: $TRACKING_SERVER_NAME"
            echo "   ARN: $MLFLOW_ARN"
            echo "tracking-server-name=$TRACKING_SERVER_NAME" >> $GITHUB_OUTPUT
          fi
      
      - name: aws-smus-cicd-cli describe (validate prod target)
        env:
          DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          DEV_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          TEST_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          PROD_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
        run: |
          echo "🔍 Validating prod target: ${{ inputs.prod_target }}"
          
          aws-smus-cicd-cli describe --manifest ${{ inputs.manifest_path }} --targets ${{ inputs.prod_target }} --connect
      
      - name: aws-smus-cicd-cli deploy to production
        env:
          DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          DEV_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          TEST_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          PROD_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          MLFLOW_TRACKING_SERVER_NAME: ${{ inputs.setup_mlflow && format('smus-integration-mlflow-{0}', vars.DOMAIN_REGION) || '' }}
          STS_REGION: ${{ vars.DOMAIN_REGION }}
          STS_ACCOUNT_ID: ${{ steps.aws-account-prod.outputs.account-id }}
          AWS_ACCOUNT_ID: ${{ steps.aws-account-prod.outputs.account-id }}
          MODEL_NAME: ${{ vars.MODEL_NAME || 'latest' }}
        run: |
          echo "🔍 DOMAIN_REGION: $DOMAIN_REGION"
          echo "🔍 PROD_DOMAIN_REGION: $PROD_DOMAIN_REGION"
          echo "🔍 MODEL_NAME: $MODEL_NAME"
          BUNDLE_FILE=$(ls ${{ runner.temp }}/smus-bundles-${{ github.run_id }}/*.zip | head -1)
          echo "🔍 Using bundle: $BUNDLE_FILE"
          
          aws-smus-cicd-cli deploy \
            --manifest ${{ inputs.manifest_path }} \
            --targets ${{ inputs.prod_target }} \
            --bundle-archive-path "$BUNDLE_FILE"

  destroy-test:
    name: Destroy Test Environment
    runs-on: ubuntu-latest
    needs: [bundle, validate, deploy-test, test]
    if: ${{ inputs.destroy_test_after_deploy && needs.bundle.result == 'success' && needs.validate.result == 'success' && needs.deploy-test.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    environment: test-aws-account

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install SMUS CI/CD CLI
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TEST }}
          aws-region: ${{ vars.DOMAIN_REGION }}
          role-session-name: smus-destroy-test-session

      - name: Get AWS Account ID
        id: aws-account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account-id=$ACCOUNT_ID" >> $GITHUB_OUTPUT

      - name: Destroy test resources
        env:
          TEST_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          DEV_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          PROD_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          AWS_ACCOUNT_ID: ${{ steps.aws-account.outputs.account-id }}
        run: |
          aws-smus-cicd-cli destroy \
            --manifest ${{ inputs.manifest_path }} \
            --targets ${{ inputs.test_target }} \
            --force \
            --output JSON | tee /tmp/destroy-output.json

      - name: Verify destroy has no errors
        run: |
          python3 - <<'EOF'
          import json, sys

          with open("/tmp/destroy-output.json") as f:
              content = f.read()

          start = content.find("{")
          end = content.rfind("}") + 1
          if start < 0:
              print("ERROR: No JSON found in destroy output")
              print(content)
              sys.exit(1)

          data = json.loads(content[start:end])
          errors = [r for results in data.get("stages", {}).values() for r in results if r["status"] == "error"]
          if errors:
              print(f"ERROR: Destroy reported {len(errors)} error(s):")
              for e in errors:
                  print(f"  - {e['resource_type']} {e['resource_id']}: {e['message']}")
              sys.exit(1)

          print("✅ Destroy completed with no errors")
          for stage, results in data.get("stages", {}).items():
              counts = {}
              for r in results:
                  counts[r["status"]] = counts.get(r["status"], 0) + 1
              print(f"  {stage}: {counts}")
          EOF

      - name: Idempotency check (second destroy)
        env:
          TEST_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          DEV_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          PROD_DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          DOMAIN_REGION: ${{ vars.DOMAIN_REGION }}
          AWS_ACCOUNT_ID: ${{ steps.aws-account.outputs.account-id }}
        run: |
          aws-smus-cicd-cli destroy \
            --manifest ${{ inputs.manifest_path }} \
            --targets ${{ inputs.test_target }} \
            --force \
            --output JSON | tee /tmp/destroy-idempotency.json

          python3 - <<'EOF'
          import json, sys

          with open("/tmp/destroy-idempotency.json") as f:
              content = f.read()

          start = content.find("{")
          end = content.rfind("}") + 1
          data = json.loads(content[start:end])
          errors = [r for results in data.get("stages", {}).values() for r in results if r["status"] == "error"]
          if errors:
              print(f"ERROR: Second destroy reported {len(errors)} error(s): {errors}")
              sys.exit(1)
          print("✅ Idempotency check passed — second destroy has no errors")
          EOF
